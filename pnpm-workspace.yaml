  "@nuxt/content": "catalog:frontend"
  "@nuxt/ui": "catalog:frontend"
  "@tiptap/extensions": "catalog:frontend"
  "@tiptap/y-tiptap": "catalog:frontend"
  "@vue/server-renderer": "catalog:frontend"
  cac: "catalog:prod"
  h3: 1.15.11
  vite: "catalog:build"
  vue: "catalog:frontend"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    cac: "^6.7.14 || ^7.0.0"
    vite: "*"
allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260804.1"
  - nostics@1.2.0
