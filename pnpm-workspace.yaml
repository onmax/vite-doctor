    "@vue/test-utils": ^2.4.10
    happy-dom: ^20.9.0
    vitest: npm:@voidzero-dev/vite-plus-test@latest
overrides:
  "@cloudflare/workers-types": "catalog:deploy"
  "@nuxt/content": "catalog:frontend"
  "@nuxt/ui": "catalog:frontend"
  "@tiptap/extensions": "catalog:frontend"
  "@tiptap/y-tiptap": "catalog:frontend"
  "@vue/server-renderer": "catalog:frontend"
  cac: "catalog:prod"
  h3: 1.15.11
  vite: "catalog:build"
  vitest: "catalog:test"
  vue: "catalog:frontend"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    cac: "^6.7.14 || ^7.0.0"
    vite: "*"
    vitest: "*"
allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  sharp: true
  vue-demi: true
  workerd: true
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@4.20260531.1"
  - nostics@0.5.0
