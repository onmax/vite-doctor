    "@oxc-project/types": ^0.133.0
    "@typescript-eslint/parser": ^8.60.0
    "@types/semver": ^7.7.1
    "@vue/compiler-sfc": ^3.5.35
    eslint: ^10.4.1
    eslint-plugin-vue: ^10.9.1
    magic-string: ^0.30.21
