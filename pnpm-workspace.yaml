    "@nuxt/ui": ^4.8.1
    "@resvg/resvg-js": ^2.6.2
    "@tiptap/core": ^3.24.0
    "@tiptap/extensions": ^3.24.0
    "@tiptap/pm": ^3.24.0
    "@tiptap/y-tiptap": ^3.0.4
    "@vue/server-renderer": ^3.5.35
    "@vueuse/core": ^14.3.0
    better-auth: ^1.6.12
    docus: 5.11.0
    nuxt: ^4.4.6
    nuxt-better-auth: ^0.6.0
    satori: ^0.26.0
    tailwindcss: ^4.3.0
    vue: ^3.5.35
  prod:
    c12: 4.0.0-beta.5
    cac: ^7.0.0
    consola: ^3.4.2
    defu: ^6.1.7
    pathe: ^2.0.3
    picocolors: ^1.1.1
    semver: ^7.8.1
    std-env: ^4.1.0
    zod: ^4.4.3
