name: Preview Package

on:
  pull_request:
  push:
    branches: [main]

# Main pushes are never cancelled, so every main commit gets a preview package.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      compatibility: false

  # Publishing only needs a passing build, so it does not wait for the OS matrix.
  compatibility:
    uses: ./.github/workflows/package-compatibility.yml

  publish:
    # Do not give fork pull requests a write-capable token while executing their package scripts.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec pkg-pr-new publish . --pnpm --bin --packageManager=pnpm
